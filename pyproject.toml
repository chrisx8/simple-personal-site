[project]
name = "simple-personal-site"
version = "1.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "django~=5.2.18",
    "django-minify-html~=1.14.0",
    "django-solo~=2.5.1",
    "gunicorn>=26.2.0,<27.0.0",
    "mistune~=3.3.3",
    "nh3~=0.3.7",
    "pillow>=13.0.0,<14.0.0",
    "psycopg2-binary>=2.9.13,<3.0.0",
    "pygments>=2.21.0,<3.0.0",
    "pymysql>=1.2.3,<2.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "requests>=2.34.2,<3.0.0",
]

[tool.uv]
exclude-newer = "P3D"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["RUF012"]
